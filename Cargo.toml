[workspace]
resolver = "2"
members = [
    "crates/pebblepost-core",
    "apps/pebblepost-server",
    "apps/pebblepost-cli",
    "apps/pebblepost-desktop/src-tauri",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
sha2 = "0.10"
hmac = "0.12"
md-5 = "0.10"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "process", "signal", "sync", "time"] }
axum = "0.7.9"
futures-util = { version = "0.3.33", default-features = false, features = ["std", "async-await"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json", "multipart", "stream", "socks"] }
rquickjs = "0.14"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
base64 = "0.22"
rusqlite = { version = "0.37", features = ["bundled"] }
tower-http = { version = "0.5.2", features = ["cors", "limit", "trace"] }
getrandom = "0.4.3"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
prost = "0.14"
prost-reflect = { version = "0.16.5", features = ["serde"] }
prost-types = "0.14"
protox = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tonic = { version = "0.14.9", features = ["transport", "tls-ring", "tls-webpki-roots"] }
tonic-reflection = "0.14.9"
tokio-stream = "0.1"
clap = { version = "4.6.7", features = ["derive"] }
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
flate2 = "1.1.11"
ring = "0.17.14"
regex = "1.13.1"
tar = "0.4.46"
zip = { version = "9.2.3", default-features = false, features = ["deflate"] }
