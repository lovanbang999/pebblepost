[package]
name = "pebblepost-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP server for PebblePost workspaces"

[[bin]]
name = "pebblepost-mcp"
path = "src/main.rs"

[dependencies]
clap.workspace = true
pebblepost-core = { path = "../../crates/pebblepost-core" }
pebblepost-server = { path = "../pebblepost-server" }
rmcp = { version = "3.11.0", features = ["transport-io"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
