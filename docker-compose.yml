services:
  pebblepost:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pebblepost
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATA_DIR=/data
      - PEBBLEPOST_MASTER_KEY=${PEBBLEPOST_MASTER_KEY:-}
    volumes:
      - pebblepost-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  pebblepost-data:
    driver: local
