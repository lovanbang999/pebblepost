name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --draft --title "PebblePost ${GITHUB_REF_NAME}" --notes-from-tag

  cli-server:
    name: CLI and server (${{ matrix.os }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-x86_64
          - os: macos-latest
            suffix: macos-x86_64
          - os: windows-latest
            suffix: windows-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev pkg-config
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build binaries and frontend
        shell: bash
        run: |
          cd web && npm ci && npm run build
          cd ..
          cargo build --release --package pebblepost-cli --package pebblepost-server
          mkdir -p release/pebblepost-${{ matrix.suffix }}
          cp target/release/pebblepost${{ runner.os == 'Windows' && '.exe' || '' }} release/pebblepost-${{ matrix.suffix }}/
          cp target/release/pebblepost-server${{ runner.os == 'Windows' && '.exe' || '' }} release/pebblepost-${{ matrix.suffix }}/
          mkdir -p release/pebblepost-${{ matrix.suffix }}/web
          cp -r web/dist release/pebblepost-${{ matrix.suffix }}/web/
          cp README.md LICENSE CHANGELOG.md release/pebblepost-${{ matrix.suffix }}/
          tar -czf release/pebblepost-${{ matrix.suffix }}.tar.gz -C release pebblepost-${{ matrix.suffix }}
      - name: Upload CLI and server archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "release/pebblepost-${{ matrix.suffix }}.tar.gz" --clobber

  desktop:
    name: Tauri desktop (${{ matrix.os }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            suffix: linux
          - os: macos-latest
            suffix: macos
          - os: windows-latest
            suffix: windows
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libwebkit2gtk-4.1-dev
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked
      - name: Build desktop bundles
        run: cargo tauri build --manifest-path apps/pebblepost-desktop/src-tauri/Cargo.toml
      - name: Upload desktop bundles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          bundle="apps/pebblepost-desktop/src-tauri/target/release/bundle"
          find "$bundle" -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \) -print0 |
            while IFS= read -r -d '' asset; do gh release upload "$GITHUB_REF_NAME" "$asset" --clobber; done
