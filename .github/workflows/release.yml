name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  # ─── 1. GoReleaser: CLI & Headless Server Binaries ───────────────────────────
  goreleaser:
    name: Release Binaries (GoReleaser)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install Minisign
        run: |
          sudo apt-get update && sudo apt-get install -y minisign

      - name: Prepare Minisign Secret Key
        if: env.MINISIGN_SECRET_KEY != ''
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          echo "$MINISIGN_SECRET_KEY" > /tmp/minisign.key
          chmod 600 /tmp/minisign.key
          echo "MINISIGN_SECRET_KEY_PATH=/tmp/minisign.key" >> $GITHUB_ENV

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINISIGN_SECRET_KEY_PATH: ${{ env.MINISIGN_SECRET_KEY_PATH }}

  # ─── 2. Desktop Builds: Wails Matrix (macOS, Windows, Linux) ─────────────────
  wails-build:
    name: Desktop Build (${{ matrix.os }})
    needs: goreleaser
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: pebblepost-darwin
            ext: zip
          - os: windows-latest
            artifact_name: pebblepost-windows-amd64
            ext: zip
          - os: ubuntu-22.04
            artifact_name: pebblepost-linux-amd64
            ext: tar.gz

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libwebkit2gtk-4.0-dev minisign

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Build Web Assets
        run: |
          cd web
          npm ci
          npm run build

      - name: Build Desktop App (macOS)
        if: runner.os == 'macOS'
        run: |
          wails build -platform darwin/universal -clean
          cd build/bin
          ditto -c -k --sequesterRsrc --keepParent pebblepost.app pebblepost-darwin-universal.app.zip
          shasum -a 256 pebblepost-darwin-universal.app.zip > pebblepost-darwin-universal.app.zip.sha256

      - name: Build Desktop App (Windows)
        if: runner.os == 'Windows'
        run: |
          wails build -platform windows/amd64 -clean
          cd build/bin
          powershell Compress-Archive -Path pebblepost.exe -DestinationPath pebblepost-windows-amd64.zip
          certutil -hashfile pebblepost-windows-amd64.zip SHA256 | findstr /V ":" > pebblepost-windows-amd64.zip.sha256

      - name: Build Desktop App (Linux)
        if: runner.os == 'Linux'
        run: |
          wails build -platform linux/amd64 -clean
          cd build/bin
          tar -czvf pebblepost-linux-amd64.tar.gz pebblepost
          sha256sum pebblepost-linux-amd64.tar.gz > pebblepost-linux-amd64.tar.gz.sha256

      - name: Upload Desktop Artifacts to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd build/bin
          find . -maxdepth 1 -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.sha256" -o -name "*.minisig" \) -exec gh release upload ${{ github.ref_name }} {} --clobber \;
