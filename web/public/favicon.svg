<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Pebble Smooth Squircle Gradient -->
    <linearGradient id="pebble-grad" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="35%" stop-color="#00a8ff" />
      <stop offset="75%" stop-color="#0066ff" />
      <stop offset="100%" stop-color="#0040c8" />
    </linearGradient>

    <!-- Gloss Highlight -->
    <linearGradient id="pebble-gloss" x1="64" y1="8" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- High-Precision Drop Shadow for App Elevation -->
    <filter id="pebble-shadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0066ff" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#002b80" flood-opacity="0.25" />
    </filter>

    <!-- Subtle Bevel Stroke -->
    <linearGradient id="pebble-stroke" x1="20" y1="12" x2="108" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#002b80" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <!-- Pebble Squircle Base with Glow & Elevation -->
  <g filter="url(#pebble-shadow)">
    <rect 
      x="10" 
      y="10" 
      width="108" 
      height="108" 
      rx="34" 
      ry="34" 
      fill="url(#pebble-grad)" 
      stroke="url(#pebble-stroke)" 
      stroke-width="2" 
    />
  </g>

  <!-- Top Curved Gloss Arc -->
  <path 
    d="M20 38 C 20 22, 34 14, 64 13 C 94 13, 108 22, 108 38 C 96 30, 78 26, 64 26 C 50 26, 32 30, 20 38 Z" 
    fill="url(#pebble-gloss)" 
  />

  <!-- Dynamic Aerodynamic Dispatch Mark (Paperplane / Send Spear) -->
  <!-- Main High-Contrast White Wing -->
  <path 
    d="M96 32 L32 62 L62 70 Z" 
    fill="#ffffff" 
  />

  <!-- Lower Wing with Crisp Light-Cyan Lighting -->
  <path 
    d="M96 32 L62 70 L82 88 Z" 
    fill="#e0f2fe" 
  />

  <!-- Keel / Rudder Fold for 3D Velocity Depth -->
  <path 
    d="M62 70 L55 90 L71 78 Z" 
    fill="#7dd3fc" 
  />

  <!-- Center Crease Definition -->
  <path 
    d="M96 32 L62 70" 
    stroke="#0284c7" 
    stroke-width="1.2" 
    stroke-linecap="round" 
    opacity="0.4" 
  />

  <!-- Velocity Sparkle / Dispatch Beacon at Nose -->
  <circle cx="96" cy="32" r="3" fill="#ffffff" />
  <circle cx="96" cy="32" r="6" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="2 2" />
</svg>
