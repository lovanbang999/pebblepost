<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Background Pebble Gradient -->
    <linearGradient id="pebble-body" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="pebble-border" x1="20" y1="16" x2="108" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glowing Arrow Symbol -->
    <linearGradient id="arrow-grad" x1="32" y1="36" x2="96" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#3b82f6" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Organic Pebble Stone Base -->
  <path d="M64 12 C96 12 116 32 116 64 C116 96 96 116 64 116 C32 116 12 96 12 64 C12 32 32 12 64 12 Z" 
        fill="url(#pebble-body)" 
        stroke="url(#pebble-border)" 
        stroke-width="3" />

  <!-- Inner Ambient Shimmer -->
  <path d="M36 24 C56 16 84 18 98 28" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.3" />

  <!-- High-Speed Dispatch Arrow / Paperplane Core with Filter Glow -->
  <g filter="url(#glow)">
    <path d="M38 64 C38 64 88 34 94 36 C96 38 78 88 78 88 L63 71 L38 64 Z" fill="url(#arrow-grad)" />
    <path d="M94 36 L63 71" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
    <path d="M63 71 L56 86 L52 74" fill="#2563eb" opacity="0.9" />
  </g>

  <!-- Pulse Ring Orbit -->
  <circle cx="94" cy="36" r="3.5" fill="#ffffff" />
  <circle cx="94" cy="36" r="7" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.8" />
</svg>
